<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Extension</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>LinkedIn Extension</h1>
      </header>
      <main class="content">
        <p id="status">Loading...</p>
        <button id="popup-btn" class="btn">Popups: ON</button>
        <button id="dev-mode-btn" class="btn btn--dev">Dev Mode: OFF</button>
        <div id="dev-section" class="dev-section" style="display:none">
          <button id="action-btn" class="btn">Highlighting: ON</button>
          <button id="view-cache-btn" class="btn btn--secondary">View Profile Cache</button>
        </div>
      </main>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
