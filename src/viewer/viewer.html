<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn Extension — Profile Cache</title>
  </head>
  <body>
    <header class="header">
      <h1>Profile Cache</h1>
      <button id="clear-btn" class="btn btn--danger">Clear All</button>
    </header>
    <main id="grid" class="grid">
      <p id="empty" class="empty" style="display:none">No cached profiles yet. Hover over profile links on LinkedIn to populate the cache.</p>
    </main>
  </body>
</html>
